name: Clipar uma live

on:
  workflow_dispatch:
    inputs:
      vod:
        description: "Link do VOD da Twitch (ou escreva teste pra um ensaio de 3 min)"
        required: true
        type: string
      quantos:
        description: "Quantos clipes montar"
        required: true
        default: "6"
        type: string
      perfil:
        description: "Perfil de HUD do jogo"
        required: true
        default: "gta6"
        type: choice
        options: [gta6, gta5, generico]
      duracao:
        description: "Duracao alvo de cada clipe, em segundos"
        required: true
        default: "150"
        type: string

jobs:
  clipar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o que o Clipador precisa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
          python -m pip install --quiet --upgrade pip
          pip install --quiet numpy Pillow yt-dlp pytesseract faster-whisper "av<15"
          ffmpeg -version | head -1
          tesseract --version | head -1

      - name: Video de ensaio (so quando vod = teste)
        if: ${{ inputs.vod == 'teste' }}
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=180" \
            -f lavfi -i "anoisesrc=d=180:c=pink:a=0.05" \
            -f lavfi -i "sine=f=700:d=180" \
            -filter_complex "[0:v]drawbox=x='150+700*abs(sin(t/25))':y=240:w=240:h=240:color=orange@0.95:t=fill[v]; \
              [2:a]volume='if(between(t,40,50)+between(t,120,132),1.0,0.02)':eval=frame[s]; \
              [1:a][s]amix=inputs=2:duration=first[a]" \
            -map "[v]" -map "[a]" -c:v libx264 -preset ultrafast -c:a aac ensaio.mp4
          ls -lh ensaio.mp4

      - name: Achar os momentos e montar os clipes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLIPADOR_HOME: ${{ github.workspace }}/dados
          CLIPADOR_SAIDA: ${{ github.workspace }}/saida
        run: |
          if [ "${{ inputs.vod }}" = "teste" ]; then
            python nuvem.py --arquivo ensaio.mp4 --quantos 2 \
              --perfil "${{ inputs.perfil }}" --alvo 60 --minimo 30 --maximo 90
          else
            python nuvem.py \
              --vod "${{ inputs.vod }}" \
              --quantos "${{ inputs.quantos }}" \
              --perfil "${{ inputs.perfil }}" \
              --alvo "${{ inputs.duracao }}"
          fi

      - name: Mostrar o que sobrou de disco
        if: always()
        run: df -h / && du -sh saida 2>/dev/null || true

      - name: Guardar os clipes pra baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipes
          path: saida/
          retention-days: 14
          if-no-files-found: warn
