name: Clipador

on:
  schedule:
    # de 6 em 6 horas: procura live nova sozinho
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      vod:
        description: "Link de qualquer live ou VOD da Twitch (vazio = a live mais nova do canal rastreado)"
        required: false
        default: ""
        type: string
      quantos:
        description: "Quantos clipes montar"
        required: false
        default: "10"
        type: string
      perfil:
        description: "Perfil de HUD do jogo"
        required: false
        default: "gta6"
        type: choice
        options: [gta6, gta5, generico]

permissions:
  contents: write

concurrency:
  group: clipador
  cancel-in-progress: false

jobs:
  clipar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Procurar live nova
        id: achar
        run: |
          pip install --quiet yt-dlp
          if [ -n "${{ inputs.vod }}" ]; then
            echo "vod=${{ inputs.vod }}" >> "$GITHUB_OUTPUT"
            echo "titulo=live escolhida na mao" >> "$GITHUB_OUTPUT"
            echo "id=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            python achar_vod.py
          fi

      - name: Liberar espaco em disco
        if: steps.achar.outputs.vod != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Instalar o que o Clipador precisa
        if: steps.achar.outputs.vod != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
          pip install --quiet numpy Pillow pytesseract faster-whisper

      - name: Achar os momentos e montar os clipes
        if: steps.achar.outputs.vod != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLIPADOR_HOME: ${{ github.workspace }}/dados
          CLIPADOR_SAIDA: ${{ github.workspace }}/saida
        run: |
          python nuvem.py \
            --vod "${{ steps.achar.outputs.vod }}" \
            --quantos "${{ inputs.quantos || '10' }}" \
            --perfil "${{ inputs.perfil || 'gta6' }}" \
            --alvo 150

      - name: Publicar os clipes
        if: steps.achar.outputs.vod != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls saida/*.mp4 >/dev/null 2>&1; then
            echo "nenhum clipe foi gerado"
            exit 0
          fi
          TAG="clipes-$(date -u +%Y%m%d-%H%M)"
          TITULO="${{ steps.achar.outputs.titulo }}"
          python corpo_release.py "$TITULO"
          gh release create "$TAG" saida/*.mp4 saida/*.jpg saida/textos.json \
            --title "$TITULO" --notes-file corpo.md

      - name: Anotar que essa live ja foi clipada
        if: steps.achar.outputs.vod != '' && github.event_name == 'schedule'
        run: |
          echo "${{ steps.achar.outputs.id }}" >> processados.txt
          git config user.name "Clipador"
          git config user.email "clipador@users.noreply.github.com"
          git add processados.txt
          git commit -m "Clipada a live ${{ steps.achar.outputs.id }}" || exit 0
          git push

      - name: Guardar tambem como anexo da execucao
        if: always() && steps.achar.outputs.vod != ''
        uses: actions/upload-artifact@v4
        with:
          name: clipes
          path: saida/
          retention-days: 5
          if-no-files-found: warn
